[package]
name = "rscpp-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WASM bindings: run C++ subset in the browser, return events"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rscpp-runtime = { path = "../runtime" }
rscpp-ast = { path = "../ast" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"

[dev-dependencies]
