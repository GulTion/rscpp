<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>rscpp WASM demo</title>
  <style>
    :root { color-scheme: light dark; font-family: ui-monospace, monospace; }
    body { max-width: 56rem; margin: 1.5rem auto; padding: 0 1rem; }
    textarea { width: 100%; height: 14rem; box-sizing: border-box; }
    button { margin: 0.5rem 0 1rem; padding: 0.4rem 0.8rem; }
    pre { background: #1111; padding: 0.75rem; overflow: auto; max-height: 28rem; white-space: pre-wrap; }
    .err { color: #c22; }
  </style>
</head>
<body>
  <h1>rscpp · run()</h1>
  <p>C++ source in → value + events out (no stdin/stdout).</p>
  <textarea id="src">int main() {
    vector&lt;vector&lt;int&gt;&gt; adj = {{0, 0, 0}, {0, 0, 0}, {0, 0, 0}};
    adj[0][1] = 5;
    adj[1][2] = 7;
    adj[0][2] = 10;
    int sum = 0;
    int i = 0;
    while (i &lt; 3) {
        int j = 0;
        while (j &lt; 3) {
            sum = sum + adj[i][j];
            j = j + 1;
        }
        i = i + 1;
    }
    return sum;
}</textarea>
  <br />
  <button id="run">Run</button>
  <div id="meta"></div>
  <pre id="out">Build WASM first:
  wasm-pack build crates/wasm --target web

Then from the repo root:
  python3 -m http.server 8080
Open http://localhost:8080/examples/web/</pre>

  <script type="module">
    const out = document.getElementById("out");
    const meta = document.getElementById("meta");
    const src = document.getElementById("src");

    let runFn = null;
    try {
      const mod = await import("../../crates/wasm/pkg/rscpp_wasm.js");
      await mod.default();
      runFn = mod.run;
      meta.textContent = "WASM ready.";
    } catch (e) {
      meta.innerHTML = `<span class="err">Load failed — run wasm-pack (see below).</span>`;
      console.error(e);
    }

    document.getElementById("run").onclick = () => {
      if (!runFn) return;
      try {
        const result = runFn(src.value);
        meta.textContent = result.ok
          ? `ok · value=${JSON.stringify(result.value)} · ${result.events.length} events`
          : `error · ${result.error} · ${result.events.length} events`;
        out.textContent = JSON.stringify(result, null, 2);
      } catch (e) {
        meta.innerHTML = `<span class="err">${e}</span>`;
      }
    };
  </script>
</body>
</html>
